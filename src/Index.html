<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>근태계획</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --line: #dfe2e6; --text: #1d2228; --sub: #6b7480;
    --brand: #1f6feb; --sat: #1f4fd8; --sun: #d92d20; --off-month: #f0f1f3;
    --radius: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif; font-size: 15px; }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* 상단 */
  header { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; }
  .bar h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .me .adm { color: #fff; background: var(--brand); border-radius: 6px; padding: 0 5px; margin-left: 4px; font-size: 11px; }
  .sync { width: 8px; height: 8px; border-radius: 50%; background: #2da44e; }
  .sync.busy { background: #f0a020; } .sync.err { background: var(--sun); }
  .tabs { display: flex; padding: 0 10px; gap: 4px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 9px 4px; border-bottom: 3px solid transparent; color: var(--sub); font-weight: 600; }
  .tabs button.on { color: var(--brand); border-color: var(--brand); }
  .views { display: flex; gap: 6px; padding: 8px 14px 10px; }
  .views button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .views button.on { background: var(--text); color: #fff; border-color: var(--text); }

  main { padding: 12px 10px 90px; max-width: 960px; margin: 0 auto; }
  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); padding: 12px; margin-bottom: 12px; }
  .hint { color: var(--sub); font-size: 12px; margin: 4px 2px 10px; }

  /* 내 일정 달력 */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .wd { text-align: center; font-size: 12px; color: var(--sub); padding: 2px 0 4px; font-weight: 600; }
  .cal .wd.sat { color: var(--sat); } .cal .wd.sun { color: var(--sun); }
  .day { min-height: 62px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 3px; display: flex; flex-direction: column; align-items: stretch; text-align: left; }
  .day .d { font-size: 11px; color: var(--sub); padding-left: 2px; }
  .day.sat .d { color: var(--sat); } .day.sun .d { color: var(--sun); }
  .day.other { background: var(--off-month); }
  .day.other .d::after { content: attr(data-m); font-size: 10px; margin-left: 2px; }
  .day.today { outline: 2px solid var(--brand); outline-offset: -1px; }
  .day.na { background: repeating-linear-gradient(45deg, #f3f3f3, #f3f3f3 4px, #e9e9e9 4px, #e9e9e9 8px); }
  .chip { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 700;
    line-height: 1.15; text-align: center; white-space: pre-line; margin-top: 2px; padding: 2px 1px; word-break: keep-all; }
  .chip.empty { color: #b8bec6; font-weight: 400; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--sub); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 3px; vertical-align: -1px; border: 1px solid #0001; }

  /* 전체 일정 표 */
  .filters { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .filters select, .filters input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; font: inherit; font-size: 13px; }
  .filters input { flex: 1; min-width: 100px; }
  .grid-wrap { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  table.grid { border-collapse: separate; border-spacing: 0; font-size: 11px; }
  .grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; padding: 0; }
  .grid thead th { position: sticky; top: 0; background: #fafbfc; z-index: 2; height: 38px; min-width: 44px; font-weight: 600; cursor: pointer; }
  .grid thead th small { display: block; font-weight: 400; color: var(--sub); }
  .grid thead th.sat { color: var(--sat); } .grid thead th.sun { color: var(--sun); }
  .grid thead th.other { background: #eef0f2; }
  .grid .name { position: sticky; left: 0; background: #fff; z-index: 1; min-width: 74px; max-width: 90px; text-align: left; padding: 0 6px; font-size: 12px; white-space: nowrap; }
  .grid .name small { display: block; color: var(--sub); font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
  .grid thead th.name { z-index: 3; }
  .grid tr.mine .name { background: #eaf2ff; font-weight: 700; }
  .grid tr.group td { position: sticky; left: 0; background: #f2f4f7; text-align: left; font-weight: 700; padding: 4px 8px; font-size: 12px; }
  .grid td.c { height: 34px; font-weight: 700; white-space: pre-line; line-height: 1.1; cursor: pointer; }
  .grid td.c.na { background: repeating-linear-gradient(45deg, #f3f3f3, #f3f3f3 4px, #e9e9e9 4px, #e9e9e9 8px); }
  .grid td.c.ro { cursor: default; }
  .grid td.c.flash { animation: flash 1.2s; }
  @keyframes flash { 0% { box-shadow: inset 0 0 0 3px #f0a020; } 100% { box-shadow: inset 0 0 0 0 transparent; } }

  /* 바텀시트 */
  .scrim { position: fixed; inset: 0; background: #0006; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 14px 14px 22px; max-height: 85vh; overflow: auto; }
  .sheet h2 { font-size: 16px; margin: 0 0 2px; }
  .sheet .now { font-size: 13px; color: var(--sub); margin-bottom: 12px; }
  .codes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .codes button { border: 1px solid #0002; border-radius: 10px; padding: 12px 4px; font-weight: 700; font-size: 14px; white-space: pre-line; line-height: 1.15; }
  .codes button.cur { outline: 3px solid var(--brand); outline-offset: 1px; }
  .codes button.clear { background: #fff; color: var(--sub); font-weight: 400; }
  .sheet .sec { font-size: 12px; color: var(--sub); margin: 12px 0 6px; font-weight: 600; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 14px; font-weight: 600; }
  .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn.danger { color: var(--sun); }
  .btn.block { width: 100%; margin-top: 10px; }

  /* 로그인 */
  #login { max-width: 520px; margin: 0 auto; padding: 24px 14px; }
  #login h1 { font-size: 20px; margin: 10px 0 4px; }
  #login input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; margin: 12px 0 8px; }
  .plist .grp { font-size: 12px; color: var(--sub); margin: 14px 2px 6px; font-weight: 700; }
  .plist .people { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .plist button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 4px; }
  .plist button small { display: block; font-size: 10px; color: var(--sub); }

  /* 요약 */
  table.sum { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sum th, .sum td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: center; }
  .sum th:first-child, .sum td:first-child { text-align: left; }
  .sum tr.total td { font-weight: 700; background: #fafbfc; }

  /* 관리 */
  .adm-list .row { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .adm-list .row .who { flex: 1; min-width: 0; }
  .adm-list .row .who small { display: block; color: var(--sub); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 34px; height: 34px; }
  .form label { display: block; font-size: 12px; color: var(--sub); margin: 10px 0 4px; }
  .form input, .form select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; }
  .hist { font-size: 13px; }
  .hist .row { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .hist .row small { color: var(--sub); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d2228; color: #fff; padding: 10px 16px;
    border-radius: 999px; font-size: 13px; z-index: 99; max-width: 90vw; }
  .loading { text-align: center; color: var(--sub); padding: 60px 0; }
</style>
</head>
<body>

<div id="loading" class="loading">불러오는 중…</div>

<!-- 접속: 이름 선택 -->
<section id="login" class="hidden">
  <h1 id="loginTitle">근태계획</h1>
  <div class="hint">본인 이름을 선택하세요. 이 기기에서는 다음부터 자동으로 접속됩니다.</div>
  <input id="loginSearch" placeholder="이름 검색" autocomplete="off">
  <div id="loginList" class="plist"></div>
</section>

<!-- 메인 -->
<section id="app" class="hidden">
  <header>
    <div class="bar">
      <h1 id="title"></h1>
      <span id="sync" class="sync" title="실시간 동기화"></span>
      <button id="meBtn" class="me"></button>
    </div>
    <div id="monthTabs" class="tabs"></div>
    <div class="views" id="viewTabs">
      <button data-v="mine" class="on">내 일정</button>
      <button data-v="all">전체 일정</button>
      <button data-v="admin" class="admin-only hidden">관리</button>
    </div>
  </header>
  <main>
    <div id="vMine"></div>
    <div id="vAll" class="hidden"></div>
    <div id="vAdmin" class="hidden"></div>
  </main>
</section>

<div id="modal"></div>

<script>
/* =====================================================================
 * 서버 호출: Apps Script(google.script.run)을 Promise로 감쌈.
 * 미리보기에서는 window.MockServer 가 대신 응답한다.
 * ===================================================================== */
function call(fn, ...args) {
  if (window.MockServer) return window.MockServer.call(fn, args);
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

const POLL_MS = 15000;
const WD = ['월', '화', '수', '목', '금', '토', '일'];
const LS_KEY = 'attendance.session';

const S = {
  boot: null,           // { title, codes, people, months, today }
  cells: {},            // cells[personId][yyyy-mm-dd] = code ('' = 빈칸)
  generated: {},        // generated[yyyy-mm-dd] = true (해당 월 일정이 생성됨)
  version: 0,
  me: null,             // { id, token, admin }
  month: 0,             // 보고 있는 월 인덱스 (boot.months)
  view: 'mine',
  filter: { org: '', q: '' },
};

/* ---------- 유틸 ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const oneLine = s => String(s ?? '').replace(/\n/g, '');
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function fmt(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return fmt(d); }
function monthDates(m) { const out = []; for (let i = 0; i < m.days; i++) out.push(addDays(m.start, i)); return out; }
function wdIndex(s) { return (parseDate(s).getDay() + 6) % 7; } // 월=0 … 일=6
function md(s) { const d = parseDate(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function codeInfo(code) { return S.boot.codes.find(c => c.code === code); }
function chipStyle(code) { const c = codeInfo(code); return c ? `background:${c.bg};color:${c.fg}` : ''; }
function person(id) { return S.boot.people.find(p => p.id === id); }
function canEdit(pid) { return S.me && (S.me.admin || S.me.id === pid); }
function cell(pid, date) { return (S.cells[pid] || {})[date] || ''; }

let toastTimer;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 2200);
}
function setSync(state) { const el = $('#sync'); if (el) el.className = 'sync ' + (state || ''); }

/* ---------- 시작 ---------- */
async function start() {
  try {
    S.boot = await call('getBootstrap');
  } catch (e) { $('#loading').textContent = '불러오지 못했습니다: ' + (e.message || e); return; }
  document.title = S.boot.title;
  try { S.me = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { S.me = null; }
  if (S.me && !person(S.me.id)) S.me = null;
  if (S.me && S.me.admin) {
    const ok = await call('checkAdminToken', S.me.id, S.me.token).catch(() => false);
    if (!ok) { S.me.admin = false; S.me.token = null; saveMe(); }
  }
  $('#loading').classList.add('hidden');
  if (!S.me) showLogin(); else enterApp();
}

function saveMe() { try { localStorage.setItem(LS_KEY, JSON.stringify(S.me)); } catch (e) {} }

/* ---------- 이름 선택 ---------- */
function showLogin() {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#loginTitle').textContent = S.boot.title;
  const render = () => {
    const q = $('#loginSearch').value.trim();
    const groups = {};
    S.boot.people.filter(p => !q || p.name.includes(q)).forEach(p => {
      const g = p.org || '기타'; (groups[g] = groups[g] || []).push(p);
    });
    $('#loginList').innerHTML = Object.keys(groups).map(g => `
      <div class="grp">${esc(oneLine(g))}</div>
      <div class="people">${groups[g].map(p => `<button data-id="${esc(p.id)}">${esc(p.name)}<small>${esc(oneLine(p.g3 || p.g2 || p.g1))}</small></button>`).join('')}</div>`).join('')
      || '<div class="hint">검색 결과가 없습니다.</div>';
  };
  $('#loginSearch').oninput = render;
  $('#loginList').onclick = e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    pickPerson(person(b.dataset.id));
  };
  render();
}

function pickPerson(p) {
  if (!p.admin) { S.me = { id: p.id, admin: false }; saveMe(); enterApp(); return; }
  openSheet(`
    <h2>${esc(p.name)}님은 관리자입니다</h2>
    <div class="now">관리자 비밀번호를 입력하면 모든 사람의 일정과 인원을 관리할 수 있습니다.</div>
    <div class="form"><input id="pw" type="password" placeholder="관리자 비밀번호" autocomplete="current-password"></div>
    <button class="btn primary block" id="pwOk">관리자로 접속</button>
    <button class="btn block" id="pwSkip">비밀번호 없이 접속 (본인 일정만 수정)</button>`);
  $('#pw').focus();
  $('#pwOk').onclick = async () => {
    try {
      const token = await call('adminLogin', p.id, $('#pw').value);
      S.me = { id: p.id, admin: true, token }; saveMe(); closeSheet(); enterApp();
    } catch (e) { toast(errMsg(e)); }
  };
  $('#pw').onkeydown = e => { if (e.key === 'Enter') $('#pwOk').click(); };
  $('#pwSkip').onclick = () => { S.me = { id: p.id, admin: false }; saveMe(); closeSheet(); enterApp(); };
}

function errMsg(e) { return (e && (e.message || e)) + ''; }

/* ---------- 메인 ---------- */
async function enterApp() {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#title').textContent = S.boot.title;
  const me = person(S.me.id);
  $('#meBtn').innerHTML = esc(me.name) + (S.me.admin ? '<span class="adm">관리자</span>' : '');
  document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !S.me.admin));
  $('#monthTabs').innerHTML = S.boot.months.map((m, i) => `<button data-i="${i}" class="${i === S.month ? 'on' : ''}">${esc(m.label)}</button>`).join('');
  await loadSchedule();
  render();
  schedulePoll();
}

async function loadSchedule() {
  setSync('busy');
  const res = await call('getSchedule');
  S.cells = res.cells; S.generated = res.generated; S.version = res.version; S.sv = res.sv;
  setSync('');
}

$('#monthTabs').onclick = e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  S.month = +b.dataset.i;
  document.querySelectorAll('#monthTabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
};
$('#viewTabs').onclick = e => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  S.view = b.dataset.v;
  document.querySelectorAll('#viewTabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
};
$('#meBtn').onclick = () => {
  openSheet(`
    <h2>${esc(person(S.me.id).name)}</h2>
    <div class="now">${S.me.admin ? '관리자로 접속 중' : '팀원으로 접속 중'}</div>
    <button class="btn block" id="switchUser">다른 이름으로 접속</button>
    ${person(S.me.id).admin && !S.me.admin ? '<button class="btn block" id="toAdmin">관리자로 접속</button>' : ''}`);
  $('#switchUser').onclick = () => { S.me = null; saveMe(); closeSheet(); stopPoll(); showLogin(); };
  const ta = $('#toAdmin'); if (ta) ta.onclick = () => { closeSheet(); pickPerson(person(S.me.id)); };
};

function render() {
  $('#vMine').classList.toggle('hidden', S.view !== 'mine');
  $('#vAll').classList.toggle('hidden', S.view !== 'all');
  $('#vAdmin').classList.toggle('hidden', S.view !== 'admin');
  if (S.view === 'mine') renderMine();
  else if (S.view === 'all') renderAll();
  else renderAdmin();
}

/* ---------- 내 일정 ---------- */
function renderMine() {
  const m = S.boot.months[S.month];
  const dates = monthDates(m);
  const pid = S.me.id;
  const html = [];
  WD.forEach((w, i) => html.push(`<div class="wd ${i === 5 ? 'sat' : i === 6 ? 'sun' : ''}">${w}</div>`));
  dates.forEach(d => {
    const dt = parseDate(d), wi = wdIndex(d), code = cell(pid, d);
    const other = dt.getMonth() + 1 !== m.month;
    const na = !S.generated[d];
    html.push(`<button class="day ${wi === 5 ? 'sat' : wi === 6 ? 'sun' : ''} ${other ? 'other' : ''} ${na ? 'na' : ''} ${d === S.boot.today ? 'today' : ''}"
      data-d="${d}" data-m="(${dt.getMonth() + 1}월)">
      <span class="d">${dt.getDate()}</span>
      <span class="chip ${code ? '' : 'empty'}" style="${chipStyle(code)}">${na ? '미생성' : code ? esc(code) : '-'}</span>
    </button>`);
  });
  $('#vMine').innerHTML = `
    <div class="card">
      <div class="cal" id="myCal">${html.join('')}</div>
      <div class="legend">${S.boot.codes.filter(c => c.active).slice(0, 9).map(c => `<span><i style="background:${c.bg}"></i>${esc(oneLine(c.code))}</span>`).join('')}</div>
    </div>
    <div class="hint">날짜를 누르면 근태를 바꿀 수 있습니다. 회색 칸은 앞뒤 달의 날짜이며, 양쪽 달에 함께 반영됩니다.</div>`;
  $('#myCal').onclick = e => {
    const b = e.target.closest('.day'); if (!b) return;
    openPicker(pid, b.dataset.d);
  };
}

/* ---------- 근태 선택 ---------- */
function openPicker(pid, date) {
  if (!S.generated[date]) { toast('아직 생성되지 않은 달입니다. 매월 21일에 자동 생성됩니다.'); return; }
  if (!canEdit(pid)) { toast('본인 일정만 수정할 수 있습니다.'); return; }
  const p = person(pid), cur = cell(pid, date), wi = wdIndex(date);
  const codes = S.boot.codes.filter(c => c.active);
  const btn = c => `<button data-c="${esc(c.code)}" class="${c.code === cur ? 'cur' : ''}" style="background:${c.bg};color:${c.fg}">${esc(c.code)}</button>`;
  const main = codes.filter(c => c.primary), more = codes.filter(c => !c.primary);
  openSheet(`
    <h2>${md(date)}(${WD[wi]}) · ${esc(p.name)}</h2>
    <div class="now">현재: <b>${cur ? esc(oneLine(cur)) : '빈칸'}</b></div>
    <div class="codes" id="pick">${main.map(btn).join('')}</div>
    ${more.length ? `<div class="sec">기타</div><div class="codes" id="pick2">${more.map(btn).join('')}</div>` : ''}
    <div class="sec"></div>
    <div class="codes"><button class="clear" data-c="">빈칸으로</button></div>`);
  $('#modal').querySelectorAll('button[data-c]').forEach(b => b.onclick = () => { closeSheet(); setCode(pid, date, b.dataset.c); });
}

async function setCode(pid, date, code) {
  const prev = cell(pid, date);
  if (prev === code) return;
  (S.cells[pid] = S.cells[pid] || {})[date] = code;   // 화면 먼저 반영
  render();
  setSync('busy');
  try {
    const res = await call('setCell', { actorId: S.me.id, token: S.me.token || '', personId: pid, date, code, prev });
    if (res.conflict) {
      S.cells[pid][date] = res.current;
      toast(`다른 사람이 먼저 "${oneLine(res.current) || '빈칸'}"(으)로 바꿨습니다. 다시 선택해 주세요.`);
      render();
    }
    setSync('');
  } catch (e) {
    S.cells[pid][date] = prev; render(); setSync('err'); toast('저장 실패: ' + errMsg(e));
  }
}

/* ---------- 전체 일정 ---------- */
function renderAll() {
  const m = S.boot.months[S.month];
  const dates = monthDates(m);
  const orgs = [...new Set(S.boot.people.map(p => p.org))];
  const f = S.filter;
  const people = S.boot.people.filter(p => (!f.org || p.org === f.org) && (!f.q || p.name.includes(f.q)));

  const head = `<tr><th class="name">이름</th>${dates.map(d => {
    const dt = parseDate(d), wi = wdIndex(d), other = dt.getMonth() + 1 !== m.month;
    return `<th data-d="${d}" class="${wi === 5 ? 'sat' : wi === 6 ? 'sun' : ''} ${other ? 'other' : ''}">${other ? md(d) : dt.getDate()}<small>${WD[wi]}</small></th>`;
  }).join('')}</tr>`;

  let lastGroup = null; const rows = [];
  // 내 행을 맨 위에 고정
  const mine = people.find(p => p.id === S.me.id);
  if (mine) rows.push(rowHtml(mine, dates, true));
  people.forEach(p => {
    const g = [p.org, p.g1].filter(Boolean).map(oneLine).join(' · ');
    if (g !== lastGroup) { rows.push(`<tr class="group"><td colspan="${dates.length + 1}">${esc(g)}</td></tr>`); lastGroup = g; }
    rows.push(rowHtml(p, dates, false));
  });

  $('#vAll').innerHTML = `
    <div class="filters">
      <select id="fOrg"><option value="">전체 소속</option>${orgs.map(o => `<option ${o === f.org ? 'selected' : ''} value="${esc(o)}">${esc(oneLine(o))}</option>`).join('')}</select>
      <input id="fQ" placeholder="이름 검색" value="${esc(f.q)}">
    </div>
    <div class="grid-wrap"><table class="grid" id="grid"><thead>${head}</thead><tbody>${rows.join('')}</tbody></table></div>
    <div class="hint">${S.me.admin ? '관리자: 모든 칸을 눌러 수정할 수 있습니다.' : '본인 행(파란색)만 수정할 수 있습니다.'} 날짜 머리글을 누르면 그날 인원 집계를 봅니다.</div>
    <button class="btn block" id="exportBtn">📥 ${esc(m.label)} 근무표 엑셀로 내려받기</button>`;

  $('#exportBtn').onclick = e => exportMonth(e.currentTarget);
  $('#fOrg').onchange = e => { f.org = e.target.value; renderAll(); };
  $('#fQ').oninput = e => { f.q = e.target.value.trim(); clearTimeout(S._qt); S._qt = setTimeout(() => { renderAll(); const i = $('#fQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  $('#grid').onclick = e => {
    const th = e.target.closest('thead th[data-d]'); if (th) { openDaySummary(th.dataset.d); return; }
    const td = e.target.closest('td.c'); if (!td) return;
    openPicker(td.parentNode.dataset.p, td.dataset.d);
  };
}

function rowHtml(p, dates, pinned) {
  const editable = canEdit(p.id);
  return `<tr data-p="${esc(p.id)}" class="${p.id === S.me.id ? 'mine' : ''}">
    <td class="name">${esc(p.name)}<small>${esc(oneLine(pinned ? '내 일정' : (p.g3 || p.g2 || p.g1)))}</small></td>
    ${dates.map(d => {
      const code = cell(p.id, d), na = !S.generated[d];
      return `<td class="c ${na ? 'na' : ''} ${editable ? '' : 'ro'}" data-d="${d}" style="${chipStyle(code)}">${esc(code)}</td>`;
    }).join('')}</tr>`;
}

/* ---------- 일자별 집계 ---------- */
function openDaySummary(date) {
  const teams = [...new Set(S.boot.people.map(p => p.team))];
  const counts = {}; // counts[code][team]
  S.boot.people.forEach(p => {
    const c = cell(p.id, date) || '(빈칸)';
    counts[c] = counts[c] || {}; counts[c][p.team] = (counts[c][p.team] || 0) + 1;
  });
  const order = S.boot.codes.map(c => c.code).concat(['(빈칸)']).filter(c => counts[c]);
  Object.keys(counts).forEach(c => { if (!order.includes(c)) order.push(c); });
  const total = t => S.boot.people.filter(p => p.team === t).length;
  openSheet(`
    <h2>${md(date)}(${WD[wdIndex(date)]}) 인원 집계</h2>
    <div class="now">근태별 인원</div>
    <table class="sum"><tr><th>근태</th>${teams.map(t => `<th>${esc(t)}</th>`).join('')}<th>총원</th></tr>
      ${order.map(c => `<tr><td><span class="chip" style="display:inline-block;padding:2px 6px;${chipStyle(c)}">${esc(oneLine(c))}</span></td>
        ${teams.map(t => `<td>${counts[c][t] || ''}</td>`).join('')}<td>${Object.values(counts[c]).reduce((a, b) => a + b, 0)}</td></tr>`).join('')}
      <tr class="total"><td>합계</td>${teams.map(t => `<td>${total(t)}</td>`).join('')}<td>${S.boot.people.length}</td></tr>
    </table>
    <button class="btn block" onclick="closeSheet()">닫기</button>`);
}

/* ---------- 관리 ---------- */
let adminTab = 'people';
function renderAdmin() {
  if (!S.me.admin) { $('#vAdmin').innerHTML = ''; return; }
  const tabs = [['people', '인원'], ['codes', '근태 목록'], ['history', '변경 이력']];
  $('#vAdmin').innerHTML = `
    <div class="views" style="padding:0 0 10px">${tabs.map(([k, l]) => `<button data-a="${k}" class="${k === adminTab ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div id="adminBody"></div>`;
  $('#vAdmin .views').onclick = e => { const b = e.target.closest('button[data-a]'); if (b) { adminTab = b.dataset.a; renderAdmin(); } };
  ({ people: adminPeople, codes: adminCodes, history: adminHistory })[adminTab]();
}

function adminPeople() {
  const list = S.boot.people.map((p, i) => `
    <div class="row" data-id="${esc(p.id)}">
      <div class="who"><b>${esc(p.name)}</b> ${p.admin ? '<span class="me" style="padding:0 6px;font-size:11px">관리자</span>' : ''}
        <small>${esc([p.org, p.g1, p.g2, p.g3].filter(Boolean).map(oneLine).join(' › '))}</small></div>
      <button class="icon" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button class="icon" data-act="down" ${i === S.boot.people.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="icon" data-act="edit">✎</button>
    </div>`).join('');
  $('#adminBody').innerHTML = `
    <div class="card"><button class="btn primary block" id="addP" style="margin:0">+ 인원 추가</button></div>
    <div class="card adm-list">${list}</div>`;
  $('#addP').onclick = () => editPerson(null);
  $('#adminBody .adm-list').onclick = async e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const id = b.closest('.row').dataset.id;
    if (b.dataset.act === 'edit') {
      const detail = await call('getPersonDetail', S.me.id, S.me.token, id).catch(() => ({}));
      return editPerson({ ...person(id), ...detail });
    }
    await adminCall('movePerson', id, b.dataset.act === 'up' ? -1 : 1);
  };
}

function editPerson(p) {
  const v = p || { name: '', team: '', org: '', g1: '', g2: '', g3: '', admin: false };
  const f = (k, label, ph = '') => `<label>${label}</label><input id="pf_${k}" value="${esc(v[k])}" placeholder="${ph}">`;
  openSheet(`
    <h2>${p ? '인원 수정' : '인원 추가'}</h2>
    <div class="form">
      ${f('name', '성명')}
      ${f('team', '팀 (집계 단위)', '예: 건축, 안전')}
      ${f('org', '소속', '예: 건축팀')}
      ${f('g1', '구분 1', '예: ST-1')}
      ${f('g2', '구분 2', '예: FAB RC')}
      ${f('g3', '구분 3', '예: FAB')}
      <label><input type="checkbox" id="pf_admin" style="width:auto" ${v.admin ? 'checked' : ''}> 관리자</label>
      <div id="pwRow" class="${v.admin ? '' : 'hidden'}"><label>관리자 비밀번호 ${p && p.admin ? '(바꿀 때만 입력)' : ''}</label><input id="pf_pw" type="password" autocomplete="new-password">
        <label>이메일 (매일 15시 변경 요약 메일 받는 주소)</label><input id="pf_email" type="email" value="${esc(v.email || '')}"></div>
      ${p ? '' : '<div class="hint">추가한 사람의 이번 달·다음 달 일정은 기본 근태(주간, 일요일 빈칸)로 채워집니다.</div>'}
    </div>
    <button class="btn primary block" id="pfSave">저장</button>
    ${p ? '<button class="btn danger block" id="pfDel">이 사람 빼기</button>' : ''}`);
  $('#pf_admin').onchange = e => $('#pwRow').classList.toggle('hidden', !e.target.checked);
  $('#pfSave').onclick = async () => {
    const data = { id: p ? p.id : '' };
    ['name', 'team', 'org', 'g1', 'g2', 'g3'].forEach(k => data[k] = $('#pf_' + k).value.trim());
    data.admin = $('#pf_admin').checked; data.password = $('#pf_pw').value; data.email = $('#pf_email').value.trim();
    if (!data.name) return toast('성명을 입력하세요.');
    if (data.admin && !(p && p.admin) && !data.password) return toast('관리자 비밀번호를 입력하세요.');
    if (await adminCall('savePerson', data)) closeSheet();
  };
  const del = $('#pfDel');
  if (del) del.onclick = async () => {
    if (p.id === S.me.id) return toast('본인은 뺄 수 없습니다.');
    if (!confirm(`${p.name}님을 명단에서 뺄까요?\n지난 일정 기록은 남고, 이후 달부터 표시되지 않습니다.`)) return;
    if (await adminCall('removePerson', p.id)) closeSheet();
  };
}

/** 관리자 기능 호출 후 명단·근태 목록을 새로 받아 다시 그린다. */
async function adminCall(fn, ...args) {
  setSync('busy');
  try {
    const res = await call(fn, S.me.id, S.me.token, ...args);
    S.boot = await call('getBootstrap');
    await loadSchedule();
    render();
    toast('저장했습니다.');
    return res || true;
  } catch (e) { setSync('err'); toast(errMsg(e)); return false; }
}

function adminCodes() {
  const rows = S.boot.codes.map((c, i) => `
    <div class="row" data-i="${i}">
      <span class="chip" style="flex:0 0 76px;padding:6px 2px;${chipStyle(c.code)}">${esc(c.code)}</span>
      <div class="who"><small>${c.work ? '근무' : '비근무'} · ${c.primary ? '자주 씀' : '기타'}${c.active ? '' : ' · 숨김'}</small></div>
      <button class="icon" data-act="edit">✎</button>
    </div>`).join('');
  $('#adminBody').innerHTML = `
    <div class="card"><button class="btn primary block" id="addC" style="margin:0">+ 근태 추가</button></div>
    <div class="card adm-list">${rows}</div>
    <div class="hint">표기는 엑셀 양식과 똑같이 적어야 집계·추출이 맞습니다. 칸 안 줄바꿈은 "1Shift/(OT)"처럼 / 로 적으세요.</div>`;
  $('#addC').onclick = () => editCode(null);
  $('#adminBody .adm-list').onclick = e => { const r = e.target.closest('.row'); if (r && e.target.closest('[data-act]')) editCode(S.boot.codes[+r.dataset.i]); };
}

function editCode(c) {
  const v = c || { code: '', bg: '#ffffff', fg: '#000000', work: true, primary: false, active: true, base: '', group: '' };
  openSheet(`
    <h2>${c ? '근태 수정' : '근태 추가'}</h2>
    <div class="form">
      <label>표기 (줄바꿈은 /)</label><input id="cf_code" value="${esc(v.code.replace(/\n/g, '/'))}" ${c ? 'readonly' : ''}>
      <label>배경색</label><input id="cf_bg" type="color" value="${esc(v.bg)}">
      <label>글자색</label><input id="cf_fg" type="color" value="${esc(v.fg)}">
      <label>기본형 (새 달 기본 근태 계산 시 합산할 근무형태, 예: 1Shift(OT) → 1Shift)</label><input id="cf_base" value="${esc(v.base)}">
      <label>집계 묶음 (엑셀 하단 집계표: 1Shift / 주간 / 2Shift 중 하나, 없으면 비움)</label><input id="cf_group" value="${esc(v.group || '')}">
      <label><input type="checkbox" id="cf_work" style="width:auto" ${v.work ? 'checked' : ''}> 근무형태 (기본 근태 계산에 포함)</label>
      <label><input type="checkbox" id="cf_primary" style="width:auto" ${v.primary ? 'checked' : ''}> 선택 목록 위쪽에 표시</label>
      <label><input type="checkbox" id="cf_active" style="width:auto" ${v.active ? 'checked' : ''}> 사용</label>
    </div>
    <button class="btn primary block" id="cfSave">저장</button>`);
  $('#cfSave').onclick = async () => {
    const data = { code: $('#cf_code').value.trim().replace(/\//g, '\n'), bg: $('#cf_bg').value, fg: $('#cf_fg').value,
      base: $('#cf_base').value.trim(), group: $('#cf_group').value.trim(), work: $('#cf_work').checked, primary: $('#cf_primary').checked, active: $('#cf_active').checked };
    if (!data.code) return toast('표기를 입력하세요.');
    if (await adminCall('saveCode', data)) closeSheet();
  };
}

async function exportMonth(btn) {
  const m = S.boot.months[S.month];
  btn.disabled = true; const label = btn.textContent; btn.textContent = '엑셀 만드는 중… (10초 정도)';
  try {
    const res = await call('exportMonth', S.me.id, S.me.token || '', m.key);
    download(res.filename, res.base64);
    openSheet(`
      <h2>${esc(m.label)} 근무표</h2>
      <div class="now">${esc(res.filename)}</div>
      <div class="hint">다운로드가 시작되지 않으면 (카카오톡 등 앱 안에서 열었을 때) 아래 버튼을 누르세요.</div>
      ${res.url ? `<a class="btn primary block" style="display:block;text-align:center;text-decoration:none" href="${esc(res.url)}" target="_blank">파일 받기</a>` : ''}
      <button class="btn block" onclick="closeSheet()">닫기</button>`);
  } catch (e) { toast('엑셀 만들기 실패: ' + errMsg(e)); }
  btn.disabled = false; btn.textContent = label;
}

function download(filename, b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function adminHistory() {
  $('#adminBody').innerHTML = '<div class="card hist">불러오는 중…</div>';
  try {
    const rows = await call('getHistory', S.me.id, S.me.token, 100);
    $('#adminBody').innerHTML = `<div class="card hist">${rows.map(r => `
      <div class="row"><b>${esc(r.target)}</b> ${md(r.date)} ${esc(oneLine(r.before) || '빈칸')} → <b>${esc(oneLine(r.after) || '빈칸')}</b>
      <br><small>${esc(r.at)} · ${esc(r.actor)}${r.actor !== r.target ? ' (대리 수정)' : ''}</small></div>`).join('') || '변경 이력이 없습니다.'}</div>
      <div class="hint">매일 15시에 관리자에게 전날 15시 이후 변경 요약 메일이 발송됩니다.</div>`;
  } catch (e) { toast(errMsg(e)); }
}

/* ---------- 바텀시트 ---------- */
function openSheet(html) {
  $('#modal').innerHTML = `<div class="scrim"><div class="sheet">${html}</div></div>`;
  $('#modal .scrim').onclick = e => { if (e.target.classList.contains('scrim')) closeSheet(); };
}
function closeSheet() { $('#modal').innerHTML = ''; }

/* ---------- 실시간 동기화 (폴링) ---------- */
let pollTimer;
function schedulePoll() { stopPoll(); pollTimer = setTimeout(poll, POLL_MS); }
function stopPoll() { clearTimeout(pollTimer); }
async function poll() {
  if (document.hidden) return schedulePoll();
  try {
    const res = await call('getChanges', S.version, S.sv);
    if (res.reload) { S.boot = await call('getBootstrap'); await loadSchedule(); render(); }
    else if (res.changes.length) {
      res.changes.forEach(c => { (S.cells[c.personId] = S.cells[c.personId] || {})[c.date] = c.code; });
      S.version = res.version;
      if (!$('#modal').innerHTML) render(); // 선택 중에는 화면을 바꾸지 않음
      res.changes.forEach(c => { const td = document.querySelector(`tr[data-p="${CSS.escape(c.personId)}"] td[data-d="${c.date}"]`); if (td) td.classList.add('flash'); });
    }
    setSync('');
  } catch (e) { setSync('err'); }
  schedulePoll();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && S.boot) { stopPoll(); poll(); } });

start();
</script>
</body>
</html>
